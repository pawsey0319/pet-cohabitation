name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/agent-workbench-pet-onboarding
    paths:
      - ".github/workflows/android-preview.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_DEMO_MODE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate public runtime configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "Supabase URL must be a cloud URL" >&2; exit 1 ;;
          esac

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease
          --no-daemon
          --max-workers=2
          -PreactNativeArchitectures=arm64-v8a
          -Dorg.gradle.parallel=false
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"

      - name: Verify APK and record signing certificate
        shell: bash
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > android/app/build/outputs/apk/release/verification.txt
          "$build_tools/aapt" dump badging "$apk" | sed -n '1p' >> android/app/build/outputs/apk/release/verification.txt
          sha256sum "$apk" >> android/app/build/outputs/apk/release/verification.txt
          cat android/app/build/outputs/apk/release/verification.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pet-cohabitation-android-preview
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/verification.txt
          if-no-files-found: error
          retention-days: 14
