project_id = "pet-cohabitation"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://pet-cohabitation-public.vercel.app"
additional_redirect_urls = ["https://pet-cohabitation-public.vercel.app/**", "https://pet-cohabitation-online.vercel.app/**", "https://pet-cohabitation-live.vercel.app/**", "https://pet-cohabitation-demo.vercel.app/**", "http://localhost:8081/**", "http://localhost:3000/**"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "8MiB"

[edge_runtime]
policy = "per_worker"

