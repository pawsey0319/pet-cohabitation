<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>异宠 · 陪伴原型</title>
  <style>
    /* Neutral Modern tokens.css — pasted verbatim */
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-warm: var(--surface);
      --fg: #111111;
      --fg-2: var(--fg);
      --muted: #6b6b6b;
      --meta: var(--muted);
      --border: #e5e5e5;
      --border-soft: var(--border);
      --accent: #2f6feb;
      --accent-on: #ffffff;
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --success: #17a34a;
      --warn: #eab308;
      --danger: #dc2626;
      --font-display: "Inter", -apple-system, system-ui, sans-serif;
      --font-body: "Inter", -apple-system, system-ui, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", monospace;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 20px;
      --text-xl: 24px;
      --text-2xl: 32px;
      --text-3xl: 48px;
      --text-4xl: 64px;
      --leading-body: 1.5;
      --leading-tight: 1.2;
      --tracking-display: -0.01em;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --space-20: 80px;
      --section-y-desktop: 80px;
      --section-y-tablet: 48px;
      --section-y-phone: 32px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 0 2px 8px color-mix(in oklab, var(--fg), transparent 92%);
      --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 70%);
      --motion-fast: 150ms;
      --motion-base: 200ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      --container-max: 1200px;
      --container-gutter-desktop: 24px;
      --container-gutter-tablet: 16px;
      --container-gutter-phone: 12px;
    }
    /* Product override — user brief: warm apricot / terracotta, not Neutral Modern cobalt */
    :root {
      --accent: #b5694a;
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --font-display: "Inter", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-body: "Inter", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      --leading-body: 1.7;
      --leading-tight: 1.35;
      --studio-bg: #ececec;
      --studio-fg: #111111;
      --device-shell: #2a2a2a;
      --bubble-user-bg: color-mix(in oklab, var(--accent) 14%, var(--surface));
      --bubble-user-fg: var(--fg);
      --bubble-pet-bg: var(--surface);
      --bubble-pet-fg: var(--fg);
      --chat-bg: var(--bg);
      --chat-dim: 0;
      --device-w: 390px;
      --device-h: 844px;
      --vv-kb: 0px;
    }
    :root[data-theme="dark"] {
      --bg: #141312;
      --surface: #1c1b1a;
      --surface-warm: var(--surface);
      --fg: #f0eeeb;
      --fg-2: var(--fg);
      --muted: #a3a09a;
      --meta: var(--muted);
      --border: color-mix(in oklab, #ffffff 10%, transparent);
      --border-soft: var(--border);
      --accent: #c17a5c;
      --accent-on: #ffffff;
      --accent-hover: color-mix(in oklab, var(--accent), white 8%);
      --accent-active: color-mix(in oklab, var(--accent), white 14%);
      --success: #3dbe6a;
      --warn: #d4a017;
      --danger: #f07167;
      --elev-raised: 0 2px 8px color-mix(in oklab, #000000, transparent 55%);
      --studio-bg: #121211;
      --studio-fg: #f0eeeb;
      --device-shell: #0c0c0b;
      --bubble-user-bg: color-mix(in oklab, var(--accent) 28%, var(--surface));
      --bubble-pet-bg: color-mix(in oklab, var(--surface) 80%, #000000);
      --chat-bg: var(--bg);
    }
    :root[data-type="large"] {
      --text-base: 18px;
      --text-sm: 15px;
      --text-xs: 13px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--studio-bg);
      color: var(--studio-fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    img { max-width: 100%; display: block; }
    a { color: var(--fg); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .skip {
      position: absolute;
      left: -999px;
      top: 0;
    }
    .skip:focus { left: 8px; top: 8px; z-index: 20; background: var(--surface); padding: 8px 12px; }
    .studio {
      display: grid;
      grid-template-columns: minmax(232px, 272px) 1fr;
      min-height: 100vh;
    }
    .tools {
      border-right: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      padding: 20px 16px 32px;
      overflow: auto;
    }
    .tools h1 {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 600;
      line-height: var(--leading-tight);
      letter-spacing: 0;
      margin: 0 0 4px;
    }
    .tools .lead { color: var(--muted); font-size: var(--text-sm); margin: 0 0 20px; }
    .tools h2 {
      font-size: var(--text-xs);
      font-weight: 550;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 18px 0 8px;
    }
    .tools p.note { font-size: var(--text-xs); color: var(--muted); margin: 8px 0 0; }
    .tool-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .btn {
      min-height: 36px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      font-size: var(--text-sm);
      letter-spacing: 0.02em;
    }
    .chip.is-on, .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-on);
    }
    .chip:hover, .btn:hover { background: color-mix(in oklab, var(--fg) 6%, var(--surface)); }
    .chip.is-on:hover, .btn-primary:hover { background: var(--accent-hover); color: var(--accent-on); }
    .btn-primary:active { background: var(--accent-active); }
    .stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
    }
    .device {
      width: var(--device-w);
      height: var(--device-h);
      max-height: calc(100vh - 32px);
      background: var(--device-shell);
      border-radius: 28px;
      padding: 10px;
      box-shadow: var(--elev-raised);
    }
    .screen {
      container-type: inline-size;
      height: calc(100% - var(--vv-kb));
      background: var(--bg);
      color: var(--fg);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .statusbar {
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 550;
      letter-spacing: 0.02em;
      color: var(--fg);
    }
    .statusbar-sys { display: flex; gap: 8px; align-items: center; }
    .app {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .view[hidden] { display: none !important; }
    .topbar {
      flex: 0 0 52px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      padding: 0 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .topbar.plain { border-bottom-color: transparent; background: transparent; }
    .topbar h1, .top-title {
      margin: 0;
      text-align: center;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      line-height: var(--leading-tight);
      letter-spacing: 0;
    }
    .icon-btn {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: var(--fg);
      border-radius: var(--radius-sm);
    }
    .icon-btn:hover { background: color-mix(in oklab, var(--fg) 6%, transparent); }
    .icon-btn svg, .tabbar svg, .row-ico svg { display: block; }
    .subnav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      padding: 8px 12px 0;
      background: var(--surface);
    }
    .subnav button {
      height: 40px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: var(--text-sm);
      font-weight: 550;
      letter-spacing: 0.02em;
    }
    .subnav button.is-on { color: var(--fg); background: color-mix(in oklab, var(--fg) 6%, var(--surface)); }
    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
      background-size: cover;
      background-position: var(--chat-pos, center);
      position: relative;
    }
    .chat-scroll::before {
      content: "";
      position: sticky;
      top: 0;
      display: block;
      height: 0;
      pointer-events: none;
    }
    .chat-dim {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: color-mix(in oklab, #000000 var(--chat-dim), transparent);
      z-index: 0;
    }
    .pet-stage, .continue, .thread, .composer { position: relative; z-index: 1; }
    .pet-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 8px;
      transition: padding var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
    }
    .pet-stage.is-compact { padding-top: 8px; padding-bottom: 0; }
    .pet-stage.is-compact .pet { transform: scale(0.72); }
    .pet {
      width: 88px;
      height: 88px;
      color: color-mix(in oklab, var(--accent) 55%, var(--fg));
      transform-origin: center bottom;
    }
    .pet svg { width: 100%; height: 100%; }
    .pet.is-breathe { animation: breathe 3.6s var(--ease-standard) infinite; }
    .pet-caption { font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.02em; margin-top: 4px; }
    .pet-status { font-size: var(--text-xs); color: var(--muted); min-height: 18px; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .continue {
      margin: 8px 16px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .continue .kicker { font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.02em; }
    .continue blockquote {
      margin: 6px 0 10px;
      padding: 0;
      font-size: var(--text-sm);
      color: var(--fg);
    }
    .continue-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .linkish {
      color: var(--fg);
      font-size: var(--text-sm);
      font-weight: 550;
      letter-spacing: 0.02em;
      text-decoration: underline;
      min-height: 32px;
      padding: 0 2px;
    }
    .thread { padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
    .day-break {
      align-self: center;
      font-size: var(--text-xs);
      color: var(--muted);
      letter-spacing: 0.04em;
      padding: 4px 0;
    }
    .bubble {
      max-width: 78%;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      line-height: 1.7;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--bubble-user-bg);
      color: var(--bubble-user-fg);
    }
    .bubble.pet, .bubble.other {
      align-self: flex-start;
      background: var(--bubble-pet-bg);
      color: var(--bubble-pet-fg);
      border: 1px solid var(--border);
    }
    .bubble .meta { display: block; margin-top: 4px; font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.02em; }
    .composer {
      position: sticky;
      bottom: 0;
      margin-top: 4px;
      padding: 8px 10px 10px;
      background: color-mix(in oklab, var(--surface) 92%, transparent);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 8px;
      align-items: end;
    }
    .composer label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .composer textarea {
      width: 100%;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: var(--surface);
      color: var(--fg);
    }
    .composer textarea:focus-visible { border-color: var(--accent); }
    .send {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--accent-on);
      display: grid;
      place-items: center;
    }
    .send:hover { background: var(--accent-hover); color: var(--accent-on); }
    .send:disabled { opacity: 0.45; cursor: not-allowed; }
    .failbar {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: var(--text-sm);
      color: var(--danger);
    }
    .list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .search {
      padding: 8px 16px 4px;
      background: var(--surface);
    }
    .search input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      background: var(--bg);
    }
    .msg-row, .setting-row, .task-row, .mem-card {
      display: grid;
      gap: 2px 12px;
      padding: 12px 16px;
      min-height: 64px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      text-align: left;
      width: 100%;
    }
    .msg-row { grid-template-columns: 44px 1fr auto; align-items: center; }
    .setting-row { grid-template-columns: 1fr auto; align-items: center; min-height: 52px; }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: color-mix(in oklab, var(--accent) 16%, var(--bg));
      color: var(--accent);
      display: grid;
      place-items: center;
    }
    .msg-row .name { font-weight: 550; font-size: var(--text-sm); }
    .msg-row .preview { font-size: var(--text-sm); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-row .when { font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.02em; }
    .unread {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: var(--radius-pill);
      background: var(--accent);
      color: var(--accent-on);
      font-size: 11px;
      letter-spacing: 0.02em;
      display: inline-grid;
      place-items: center;
      margin-top: 4px;
    }
    .mem-card { grid-template-columns: 1fr; gap: 6px; }
    .mem-card .layer { font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.04em; }
    .mem-card h3 { margin: 0; font-size: var(--text-base); font-weight: 600; }
    .quote { font-size: var(--text-sm); color: var(--muted); }
    .mem-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .pill {
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 2px 6px;
      width: fit-content;
    }
    .banner {
      margin: 8px 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      font-size: var(--text-sm);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }
    .form {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: var(--text-sm); font-weight: 550; letter-spacing: 0.02em; }
    .field input, .field textarea, .field select {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: var(--surface);
      min-height: 44px;
    }
    .field .help, .count, .hint { font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.02em; }
    .err { color: var(--danger); font-size: var(--text-sm); }
    .page-body { flex: 1; overflow-y: auto; padding: 16px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .bg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bg-tile {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      text-align: left;
      background: var(--surface);
      min-height: 108px;
      display: flex;
      flex-direction: column;
    }
    .bg-tile .swatch { height: 72px; width: 100%; }
    .bg-tile span { padding: 8px 10px; font-size: var(--text-sm); }
    .bg-tile.is-on { box-shadow: var(--elev-ring); }
    .demo-tag {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .preview-chat {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      min-height: 168px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--chat-bg);
      background-size: cover;
      background-position: var(--chat-pos, center);
      position: relative;
    }
    .tabbar {
      flex: 0 0 56px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .tabbar button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      min-height: 48px;
    }
    .tabbar button.is-on { color: var(--fg); font-weight: 550; }
    .scrim {
      position: absolute;
      inset: 0;
      background: color-mix(in oklab, #000000 40%, transparent);
      display: flex;
      align-items: flex-end;
      z-index: 8;
    }
    .scrim[hidden] { display: none !important; }
    .sheet {
      width: 100%;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      padding: 8px 8px 16px;
    }
    .sheet button, .dialog-actions button {
      width: 100%;
      min-height: 48px;
      text-align: left;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      font-weight: 550;
      letter-spacing: 0.02em;
    }
    .sheet button:hover, .dialog-actions button:hover {
      background: color-mix(in oklab, var(--fg) 6%, var(--surface));
    }
    .dialog {
      margin: auto;
      width: calc(100% - 40px);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--elev-raised);
    }
    .dialog h2 { margin: 0 0 8px; font-size: var(--text-lg); }
    .dialog p { margin: 0 0 16px; color: var(--muted); font-size: var(--text-sm); }
    .hatch-pet { width: 96px; height: 96px; margin: 8px auto; color: var(--accent); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 820px) {
      .studio { grid-template-columns: 1fr; }
      .tools { order: 2; border-right: 0; border-top: 1px solid var(--border); }
      .device { max-height: 760px; }
    }
    @container (max-width: 370px) {
      .bubble { max-width: 86%; }
      .pet { width: 72px; height: 72px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pet.is-breathe { animation: none; }
      * { animation: none !important; transition: none !important; }
    }
    :root[data-motion="reduce"] .pet.is-breathe { animation: none; }
    :root[data-motion="reduce"] * { animation: none !important; transition: none !important; }
    /* Review fixes: responsive canvas, isolated pet portrait, readable controls. */
    [hidden] { display:none !important; }
    :root { --accent:#a3563c; }
    :root[data-theme="dark"] { --accent:#c17a5c; --accent-on:#171310; }

    function bindComposer(prefix) {
      const form = $('[data-composer="' + prefix + '"]');
      if (!form) return;
      const ta = form.querySelector('textarea');
      ta.addEventListener('input', function () {
        state[prefix].draft = ta.value;
        ta.style.height = '44px';
        ta.style.height = Math.min(120, ta.scrollHeight) + 'px';
      });
      ta.addEventListener('focus', function () {
        if (prefix === 'companion') {
          state.companion.inputFocus = true;
          const stage = $('.pet-stage');
          if (stage) stage.classList.add('is-compact');
          const st = $('.pet-status');
          if (st) st.textContent = '在听';
        }
        pinComposer(prefix);
      });
      ta.addEventListener('blur', function () {
        if (prefix === 'companion') { state.companion.inputFocus = false; }
      });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        sendThread(prefix);
      });
    }

    function nowTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function sendThread(prefix) {
      const box = state[prefix];
      const text = (box.draft || '').trim();
      if (!text || box.status === 'responding') return;
      box.draft = '';
      box.failedDraft = '';
      box.messages.push({ id: prefix + Date.now(), role: 'user', text: text, time: nowTime(), name: state.profile.name });
      if (state.demo.fail) {
        box.status = 'failed';
        box.failedDraft = text;
        box.draft = text;
        box.messages.pop();
        render();
        announce('发送失败，草稿已保留');
        return;
      }
      box.status = 'responding';
      render();
      pinComposer(prefix);
      announce('正在回复');
      if (state.demo.sending) return;
      clearTimeout(replyTimers[prefix]);
      replyTimers[prefix] = setTimeout(function () {
        box.messages.push({ id: prefix + 'r' + Date.now(), role: prefix === 'group' ? 'other' : 'pet', name: prefix === 'group' ? '周宁' : state.pet.name, text: autoReply(prefix, text), time: nowTime() });
        box.status = 'idle';
        render();
        pinComposer(prefix);
        announce('已回复');
      }, 900);
    }

    function autoReply(prefix, text) {
      if (prefix === 'group') return '收到，我记下了。';
      if (prefix === 'steward') {
        if (text.indexOf('摘要') !== -1) return '未回：第三节数据来源（周宁，昨天）。个人记忆未列入。';
        if (text.indexOf('待跟进') !== -1) return '待跟进：汇总本周已确认事项（失败，可重试）；整理群里未回的材料问题（进行中）。';
        return '已记下。需要的话可以把它交给主 Agent。';
      }
      if (/茶|咖啡/.test(text)) {
        const tea=state.memories.find(m=>m.id==='m1' && m.status==='active');
        const coffee=state.memories.find(m=>m.id==='m2' && m.status==='active');
        if(tea && coffee) return '你最近更偏爱茶，也保留着以前喝咖啡的经历。我们可以接着聊刚才的材料。';
        if(tea) return '你最近更偏爱茶。我们可以接着聊刚才的材料。';
        return '我会以你现在说的为准。我们可以接着聊刚才的话题。';
      }
      if (text.length > 80) return '这段我先抓住结构：你想先改哪一块？我按你的顺序听。';
      return '我在。下一条你可以直接贴改过的部分。';
    }

    function render() {
      applyChrome();

        /* stay */
      }

    $('#width-tools').innerHTML = [360, 390, 430].map(function (w) {

    }).join('');

    document.addEventListener('click', function (e) {
      const t = e.target.closest('[data-action], [data-demo]');
      if (!t) return;
      if (t.hasAttribute('data-demo') && !t.getAttribute('data-action')) {
        const key = t.getAttribute('data-demo');
        state.demo[key] = !state.demo[key];
        if (key === 'empty') { state.companion.messages = state.demo.empty ? [] : (state.demo.long ? LONG.slice() : SHORT.slice()); state.companion.continueOpen = !state.demo.empty; }
        if (key === 'long') { state.demo.empty = false; state.companion.messages = state.demo.long ? LONG.slice() : SHORT.slice(); }
        if (key === 'loggedOut') { state.auth = state.demo.loggedOut ? 'out' : 'in'; state.route = state.demo.loggedOut ? 'login' : 'companion'; }
        if (key === 'sending' && !state.demo.sending && state.companion.status === 'responding') {
          state.companion.status = 'idle';
        }
        render();
        return;
      }
      const act = t.getAttribute('data-action');
      if (act === 'width') {
        state.width = Number(t.getAttribute('data-w'));
        $$('#width-tools .chip').forEach(function (c) { c.classList.toggle('is-on', c === t); });
        render();
      } else if (act === 'tab') {
        const tab = t.getAttribute('data-tab');
        state.tab = tab;
        go(TAB_ROOTS[tab]);
      } else if (act === 'pet-sub') {
        go(t.getAttribute('data-to'));
      } else if (act === 'new-group') {
        $('#dialog').innerHTML = '<h2 id="dialog-title">新建群聊</h2><form data-form="create-group" class="stack"><div class="field"><label for="group-name">群名称</label><input id="group-name" maxlength="30" required placeholder="给群聊起个名字"></div><p class="hint">成员：你、周宁、陈可 · 示例数据</p><button type="submit" class="btn btn-primary">创建群聊</button><button type="button" class="btn" data-action="close-dialog">取消</button></form>';
        $('#dialog-scrim').hidden = false;
        $('#group-name').focus();
      } else if (act === 'go') {
        if (t.getAttribute('data-mem')) {
          if (t.getAttribute('data-to') === 'memory-form') state.editingMemory = t.getAttribute('data-mem');
          if (t.getAttribute('data-to') === 'memory-source') state.sourceMemory = t.getAttribute('data-mem');
        } else if (t.getAttribute('data-to') === 'memory-form') state.editingMemory = null;
        if (t.getAttribute('data-scope')) state.bg.scope = t.getAttribute('data-scope');
        closeSheet();
        go(t.getAttribute('data-to'));
      } else if (act === 'tab-go') {
        const to = t.getAttribute('data-to');
        if (to === 'companion') { state.tab = 'pet'; go('companion'); }
        else go(to);
      } else if (act === 'back') { closeSheet(); back(); }
      else if (act === 'reset') {
        Object.values(replyTimers).forEach(clearTimeout);
        Object.assign(state, structuredClone(initialDemoState));
        state.companion.draft = ''; state.companion.failedDraft = ''; state.companion.continueOpen = true;
        state.search = ''; state.editingMemory = null; state.sourceMemory = null;
        state.bg.photos = {};
        state.companion.messages = SHORT.slice();
        state.companion.status = 'idle';
        state.memories = seedMemories();
        state.pet = { confirmed: true, variant: 'a', name: '小陶' };
        state.bg.global = 'paper';
        state.bg.overrides = { companion: null, group: null, steward: null };
        state.demo = { fail: false, sending: false, empty: false, long: false, extractFail: false, largeType: false, loggedOut: false };
        state.auth = 'in';
        go('companion');
      } else if (act === 'continue-go') { go('companion'); $('#companion-input') && $('#companion-input').focus(); }
      else if (act === 'continue-hide') { state.companion.continueOpen = false; render(); }
      else if (act === 'continue-show') { state.companion.continueOpen = true; render(); }
      else if (act === 'new-topic') { closeSheet(); openDialog('topic'); }
      else if (act === 'sheet-companion') openSheet('companion');
      else if (act === 'sheet-group') openSheet('group');
      else if (act === 'sheet-steward') openSheet('steward');
      else if (act === 'close-sheet') closeSheet();
      else if (act === 'close-dialog') closeDialog();
      else if (act === 'dialog') openDialog(t.getAttribute('data-kind'));
      else if (act === 'dialog-topic') {
        state.companion.messages.push({ id: 'brk' + Date.now(), role: 'break', text: '新话题 · 今天' });
        state.companion.continueOpen = false;
        closeDialog();
        render();
      } else if (act === 'dialog-logout' || act === 'dialog-destroy') {
        state.auth = 'out';
        state.demo.loggedOut = true;
        closeDialog();
        go('login');
      } else if (act === 'dialog-forget') {
        const id = state._forgetId;
        state.memories.forEach(function (m) { if (m.id === id || id === 'm2' && m.id === 'm3') m.status = 'forgotten'; });
        closeDialog();
        go('memory');
        announce('已忘记，可以继续当前话题');
      } else if (act === 'retry') {
        const th = t.getAttribute('data-thread');
        state[th].draft = state[th].draft || state[th].failedDraft;
        state[th].status = 'idle';
        state.demo.fail = false;
        render();
        sendThread(th);
      } else if (act === 'mem-important') {
        state.memories.forEach(function (m) { if (m.id === t.getAttribute('data-mem')) m.important = !m.important; });
        render();
      } else if (act === 'mem-correct') {
        state._correctId = t.getAttribute('data-mem');
        openSheet('correct');
      } else if (act === 'correct-as') {
        const how = t.getAttribute('data-how');
        state.memories.forEach(function (m) {
          if (m.id !== state._correctId) return;
          m.status = how;
          if (how === 'no_longer') { m.layer = 'past'; m.note = '你表示不再喜欢。仍保留为过去偏好，没有写成讨厌。'; }
          if (how === 'never_was') { m.layer = 'change'; m.title = '已纠正的理解'; m.note = '原理解有误，不能再描述为你的真实过去。'; if(m.id === 'm2') state.memories.forEach(function(x){if(x.id === 'm3'){x.status='never_was';x.title='已失效的变化依据';x.note='关联理解已被纠正，不再用于当前回应。';}}); }
        });
        closeSheet();
        render();
        announce('已纠正，可以继续当前话题');
      } else if (act === 'mem-forget') {
        state._forgetId = t.getAttribute('data-mem');
        openDialog('forget');
      } else if (act === 'retry-extract') { state.demo.extractFail = false; render(); announce('已重新提取'); }
      else if (act === 'open-task') { state.activeTask = t.getAttribute('data-id'); go('task'); }
      else if (act === 'retry-task') {
        state.tasks.forEach(function (task) {
          if (task.id === t.getAttribute('data-id')) task.status = task.status === 'doing' ? 'done' : 'doing';
        });
        render();
      } else if (act === 'assign-agent') {
        state.tasks.unshift({ id: 't' + Date.now(), title: '跟进目录第三节数据来源', from: '项目同步群', status: 'doing', detail: '由群聊交代。' });
        closeSheet();
        go('agent');

        state.steward.draft = t.getAttribute('data-q');
        sendThread('steward');
      } else if (act === 'open-hatch') { state.hatch = { step: 'expect', text: '', pick: 'a' }; go('hatch'); }
      else if (act === 'hatch-retry') { state.hatch.step = 'generating'; render(); setTimeout(function () { state.hatch.step = 'preview'; render(); }, 800); }
      else if (act === 'hatch-pick') { state.hatch.pick = t.getAttribute('data-id'); render(); }
      else if (act === 'hatch-confirm') { state.pet.variant = state.hatch.pick; state.pet.confirmed = true; go('companion'); }
      else if (act === 'toggle-motion') { state.reduceMotion = !state.reduceMotion; render(); }
      else if (act === 'theme') { state.appearance = t.getAttribute('data-id'); render(); }
      else if (act === 'pick-bg') { setBg(t.getAttribute('data-id')); render(); }
      else if (act === 'clear-override') { state.bg.overrides[state.bg.scope] = null; render(); }
      else if (act === 'apply-photo') {
        if (!state.bg.photoUrl) { announce('请先选择图片'); return; }
        const photoId = 'photo-' + Date.now();
        state.bg.photos[photoId] = { url:state.bg.photoUrl, x:state.bg.photoPosX, y:state.bg.photoPosY, zoom:state.bg.photoZoom, dim:state.bg.photoDim, ratio:state.bg.photoRatio };
        setBg(photoId);
        go(state.bg.scope === 'global' ? 'me' : state.bg.scope);
      } else if (act === 'ai-hint') { state.bg.aiPrompt = t.getAttribute('data-id'); render(); }
      else if (act === 'ai-run') {
        state.bg.aiStatus = 'busy';
        render();
        setTimeout(function () { state.bg.aiStatus = 'done'; render(); }, 800);
      } else if (act === 'ai-pick') { state.bg.aiPick = t.getAttribute('data-id'); render(); }
      else if (act === 'ai-apply') { setBg(state.bg.aiPick); go(state.bg.scope === 'global' ? 'me' : state.bg.scope); }
      else if (act === 'do-export') {
        const blob = new Blob(['异宠演示导出\n' + state.memories.map(function (m) { return m.date + ' ' + m.title; }).join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'yichong-demo.txt';
        a.click();
      }
    });

    document.addEventListener('submit', function (e) {
      const form = e.target.closest('[data-form]');
      if (!form) return;
      e.preventDefault();
      const kind = form.getAttribute('data-form');
      if (kind === 'create-group') {
        const name = $('#group-name').value.trim();
        if(!name) return;
        state.group.name = name;
        state.group.messages = [{id:'created',role:'sys',text:'群聊已建立 · 示例数据',time:nowTime()}];
        state.group.draft = ''; state.group.status = 'idle';
        closeDialog(); go('group');
      } else if (kind === 'memory') {
        const title = $('#mem-title').value.trim();
        const quote = $('#mem-quote').value.trim();
        const layer = $('#mem-layer').value;
        const n = (title + quote).length;
        const active = state.memories.filter(function (m) { return m.manual && m.status !== 'forgotten'; }).length;
        const err = $('#mem-err');
        if (!title) { err.hidden = false; err.textContent = '请写理解本身。'; return; }
        if (n > 400) { err.hidden = false; err.textContent = '超过 400 字。'; return; }
        if (!state.editingMemory && active >= 20) { err.hidden = false; err.textContent = '已有 20 条。'; return; }
        if (state.editingMemory) {
          state.memories.forEach(function (m) { if (m.id === state.editingMemory) { m.title = title; m.quote = quote; m.layer = layer; } });
        } else {
          state.memories.unshift({ id: 'm' + Date.now(), manual: true, layer: layer, title: title, quote: quote || '（无原话）', date: '2026-09-10', important: false, status: 'active', note: '手工新增。' });
        }
        go('memory');
      } else if (kind === 'invite') {
        state.invite.zhou = $('#inv-zhou').checked;
        state.invite.chen = $('#inv-chen').checked;
        state.group.messages.push({ id: 'inv' + Date.now(), role: 'sys', text: '已发出邀请（演示）', time: nowTime() });
        go('group');
      } else if (kind === 'profile') {
        const n = $('#pf-name').value.trim();
        if (!n) return;
        state.profile.name = n;
        go('me');
      } else if (kind === 'hatch') {
        state.hatch.text = $('#hatch-text').value.trim();
        if (!state.hatch.text) return;
        state.hatch.step = 'generating';
        render();
        setTimeout(function () { state.hatch.step = state.demo.fail ? 'failed' : 'preview'; render(); }, 900);
      } else if (kind === 'login') {
        const id = $('#login-id').value.trim();
        const pw = $('#login-pw').value;
        state.login.id = id;
        if (!id || !pw) { state.login.err = '请填写账号和密码。'; render(); return; }
        if (id.indexOf('@') === -1) { state.login.err = '账号需要是邮箱。'; render(); return; }
        state.login.busy = true; state.login.err = ''; render();
        setTimeout(function () { state.login.busy = false; state.auth = 'in'; state.demo.loggedOut = false; go('companion'); }, 600);
      } else if (kind === 'register') {
        const id = $('#reg-id').value.trim();
        const pw = $('#reg-pw').value;
        const pw2 = $('#reg-pw2').value;
        state.register.id = id;
        if (!id || id.indexOf('@') === -1) { state.register.err = '请填写有效邮箱。'; render(); return; }
        if (pw.length < 8) { state.register.err = '密码至少 8 位。'; render(); return; }
        if (pw !== pw2) { state.register.err = '两次密码不一致。'; render(); return; }
        state.register.busy = true; state.register.err = ''; render();
        setTimeout(function () { state.register.busy = false; state.auth = 'in'; go('companion'); }, 600);
      }
    });

    document.addEventListener('input', function (e) {
      if (e.target.id === 'mem-title' || e.target.id === 'mem-quote') {
        const a = ($('#mem-title') && $('#mem-title').value || '') + ($('#mem-quote') && $('#mem-quote').value || '');
        if ($('#mem-count')) $('#mem-count').textContent = a.length + ' / 400';
      }
    });

    function syncClock() {
      const d = new Date();
      $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    syncClock();
    setInterval(syncClock, 30000);

    function onVV() {
      if (!window.visualViewport) return;
      const vv = window.visualViewport;
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--vv-kb', kb + 'px');
      const form = $('.view:not([hidden]) .composer');
      if (form && kb > 40) pinComposer(form.getAttribute('data-composer'));
    }

    function pinComposer(prefix) {
      const sc = $('#' + prefix + '-scroll') || $('.chat-scroll');
      if (sc) sc.scrollTop = sc.scrollHeight;
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', onVV);
      window.visualViewport.addEventListener('scroll', onVV);
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (state.appearance === 'system') render(); });
    window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', function (e) { if (e.matches) state.reduceMotion = true; render(); });

    $('#sheet-scrim').addEventListener('click', function (e) { if (e.target === $('#sheet-scrim')) closeSheet(); });
    $('#dialog-scrim').addEventListener('click', function (e) { if (e.target === $('#dialog-scrim')) closeDialog(); });

    document.addEventListener('keydown',function(e){
      const modal = !$('#dialog-scrim').hidden ? $('#dialog') : !$('#sheet-scrim').hidden ? $('#sheet') : null;
      if(!modal)return;
      if(e.key==='Escape'){e.preventDefault();closeDialog();closeSheet();return;}
      if(e.key==='Tab'){
        const items=Array.from(modal.querySelectorAll('button:not(:disabled), input, select, textarea, [tabindex="0"]'));
        if(!items.length)return;
        const first=items[0],last=items[items.length-1];
        if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
      }
    });
    render();
  })();
  </script>
</body>
</html>
